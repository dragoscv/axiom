packages:
  - packages/*
  - "!packages/_v1"
  - apps/*

catalog:
  typescript: 7.0.2
  zod: 4.6.7
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.4
  tsdown: 0.23.1
  "@biomejs/biome": 2.5.15
  "@changesets/cli": 3.0.3
  "@modelcontextprotocol/server": 2.3.1
  "@modelcontextprotocol/client": 2.3.1
  "@modelcontextprotocol/conformance": 0.1.16
  fast-check: 4.10.2
  picomatch: 4.0.7
  "@types/picomatch": 4.0.3
  diff: 9.0.0
  "@types/node": 26.6.5
  tsx: 4.23.15
  chevrotain: 13.2.0
  "@marcbachmann/cel-js": 8.0.0
  "@cedar-policy/cedar-wasm": 4.13.0
  sigstore: 5.0.0
  yaml: 2.9.1
  vscode-languageserver: 10.1.2
  vscode-languageserver-textdocument: 1.0.15
  vscode-languageclient: 10.1.2
  # Must equal packages/vscode-axm engines.vscode (^1.138.0): vsce refuses to package when
  # @types/vscode is newer than the engines floor (release run 38486626658). Bump both together.
  "@types/vscode": 1.138.0
  "@vscode/vsce": 4.0.0
  astro: 7.3.8
  "@astrojs/starlight": 0.42.6
  astro-mermaid: 2.1.0
  mermaid: 12.1.0
  happy-dom: 21.0.1
  starlight-links-validator: 0.27.0
  starlight-github-alerts: 0.5.0
  sharp: 0.35.5
  # Self-hosted site fonts (no Google Fonts request → no visitor IP sent to a third party).
  "@fontsource/instrument-serif": 5.3.0
  "@fontsource/inter": 5.3.0
  "@fontsource/jetbrains-mono": 5.3.0

allowBuilds:
  esbuild: true
  "@biomejs/biome": true
  "@vscode/vsce-sign": true

# Transitive dependencies with published advisories (pnpm audit / OSV, 2026-10-14), lifted to the
# first patched release inside their current major. None ship in the published packages: they come
# from dev tooling (changesets, conformance) and the docs site. Drop an entry once the
# parent depends on the patched range itself.
overrides:
  shell-quote: ^1.11.0 # GHSA-pqg4-j6r4-53mv (critical) via @changesets/cli > launch-editor
  "@modelcontextprotocol/sdk": ^1.31.0 # GHSA-6qxp-vccf-f47h via @modelcontextprotocol/conformance
  http-cache-semantics: ^4.3.0 # GHSA-ch52-4w7c-c8xp via astro
  source-map-js: ^1.2.2 # GHSA-68fv-2mgg-jv7q via astro > unifont > css-tree
  smol-toml: ^1.9.0 # GHSA-r4xh-jqrq-34v2 via astro
  postcss-selector-parser: ^7.1.6 # GHSA-rj75-hqrm-r3gf via expressive-code > postcss-nested
  dompurify: ^3.4.16 # GHSA-p98j-92pf-mc4p, GHSA-6688-9rhm-gjv2 via mermaid
  katex: ^0.18.2 # GHSA-238p-pmpm-9mq7 via mermaid
