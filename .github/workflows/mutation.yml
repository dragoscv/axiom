name: Mutation testing

# Stryker on the security-relevant, pure code only (canon, apply/contain +
# write, checks/predicates) — see stryker.config.mjs. Weekly, plus on PRs that
# touch those paths. Not on every PR: a full run costs ~10× the unit suite.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  pull_request:
    branches: [main]
    paths:
      - "packages/canon/src/**"
      - "packages/apply/src/**"
      - "packages/checks/src/**"
      - "stryker.config.mjs"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "0"

jobs:
  stryker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stryker
        # Informational until stryker-js#6210 (Vitest 5 support) lands; see stryker.config.mjs.
        continue-on-error: true
        run: pnpm exec stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
