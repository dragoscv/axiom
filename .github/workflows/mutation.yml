name: Mutation testing

# Stryker on the security-relevant, pure code only (canon, apply/contain +
# write, checks/predicates) — see stryker.config.mjs. Weekly, plus on PRs that
# touch those paths. Not on every PR: a full run costs ~10× the unit suite.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  pull_request:
    branches: [main]
    paths:
      - "packages/canon/src/**"
      - "packages/apply/src/**"
      - "packages/checks/src/**"
      - "stryker.config.mjs"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "0"

jobs:
  stryker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stryker
        run: pnpm exec stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
