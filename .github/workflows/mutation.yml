name: Mutation smoke

# D-38: a fixed catalog of mutants on the write gate's security decisions
# (containment, symlinks, TOCTOU, confirmDigest, DSSE, JCS, pre-image drift,
# path.deny, --root) — see scripts/mutation-smoke.mjs. Each mutant must be killed
# by the owning package's tests; a survivor fails the job. Replaces Stryker, whose
# Vitest runner is not Vitest-5 aware (stryker-js#6210). Weekly, on pushes to main
# and on PRs touching the mutated code.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  push:
    branches: [main]
    paths:
      - "packages/canon/src/**"
      - "packages/apply/src/**"
      - "packages/checks/src/**"
      - "packages/mcp/src/roots*.ts"
      - "scripts/mutation-smoke.mjs"
      - ".github/workflows/mutation.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/canon/src/**"
      - "packages/apply/src/**"
      - "packages/checks/src/**"
      - "packages/mcp/src/roots*.ts"
      - "scripts/mutation-smoke.mjs"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "0"

jobs:
  smoke:
    name: mutation smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Mutation smoke (every mutant must be killed)
        run: node scripts/mutation-smoke.mjs
