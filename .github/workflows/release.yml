name: Release

# Publishes every @codai/axiom-* package via Changesets with npm trusted
# publishing (OIDC). No NPM_TOKEN secret: npm ≥ 11.5.1 exchanges the GitHub
# id-token for a short-lived credential and attaches provenance automatically.
# Prerequisite (one-time, per package on npmjs.com): Settings → Trusted
# publishing → GitHub Actions → repo dragoscv/axiom, workflow release.yml.
#
# Jobs (Phase 5, D-27/D-29/D-31):
#   preflight        workflow_dispatch only from main or a v* tag (S-1322)
#   binaries         Node 26 single executables, one native runner per target
#                    + the native `axiom-hook` gate client (Rust, std only) on the same runner
#   publish          build → guards → stage axiom-hook binaries into packages/axiom-hook-<os>-<cpu>
#                    → changeset publish → registry verification. Runs AFTER binaries: the five
#                    @codai/axiom-hook-* packages (optionalDependencies of @codai/axiom-mcp, S-1318)
#                    must never reach npm without their binary — npm refuses to re-publish a version.
#   release-assets   SHA256SUMS + CycloneDX SBOM + Sigstore build provenance → the GitHub release,
#                    created as a DRAFT and published + marked latest only after SHA256SUMS is attached
#   vscode-extension .vsix attached to the release (+ Marketplace when VSCE_PAT is set)
#                    (+ Open VSX when OVSX_PAT is set — Cursor, VSCodium, Windsurf, Gitpod)
#   mcp-registry     server.json → registry.modelcontextprotocol.io via GitHub OIDC
#   action-tag       moves the floating `v<major>` tag of dragoscv/axiom/action forward (never back)
#   homebrew-tap     renders Formula/axiom.rb from SHA256SUMS → dragoscv/homebrew-tap
#                    (when HOMEBREW_TAP_DEPLOY_KEY is set)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege (OpenSSF Scorecard TokenPermissions): read-only by default, each job asks for
# exactly what it writes.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "0"

jobs:
  preflight:
    # S-1322: a manual run may only publish from main (re-run of the current version) or a tag.
    # A dispatch from a feature branch would publish whatever that branch's package.json says.
    name: preflight (ref allowed to publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse workflow_dispatch from any other ref
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) echo "ok" ;;
            *) echo "::error title=release::publishing is allowed only from main or a v* tag (got $GITHUB_REF)"; exit 1 ;;
          esac

  publish:
    name: build → guards → changeset publish
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # changeset publish creates git tags
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: npm ≥ 11.5.1 (trusted publishing)
        # Node 24 bundles npm 11.19+, so no `npm i -g npm@latest` (an unpinned install, Scorecard
        # PinnedDependencies) — assert the floor instead and fail loudly if a runner regresses.
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm "+process.argv[1]+" < 11.5.1: trusted publishing needs it"); process.exit(1); }' "$(npm --version)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm exec vitest run

      - name: Guards (strict — dist must exist)
        # `release-complete` asserts every tagged version is already ON the registry; running it
        # here would fail by construction on the very tag we are about to publish. It runs after
        # Publish instead, as the live verification that all 9 packages actually landed.
        run: node scripts/run-guards.mjs --strict --skip=release-complete

      - name: Release surfaces carry the npm version (fail before anything is published)
        # CITATION.cff, server.json, crates/axiom-hook Cargo.toml/.lock, vscode-axm — written by
        # `node scripts/sync-release-versions.mjs` after `changeset version`.
        run: node scripts/sync-release-versions.mjs --check

      - name: Download the axiom-hook binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: axiom-*
          path: ${{ runner.temp }}/bin
          merge-multiple: true

      - name: Stage axiom-hook into packages/axiom-hook-<os>-<cpu>/bin (S-1318)
        # Release asset target → npm package (process.platform-process.arch). Every package must
        # carry its binary before `changeset publish`, or the version is burnt on npm empty.
        shell: bash
        run: |
          set -euo pipefail
          src="${{ runner.temp }}/bin"
          for pair in win-x64:win32-x64 linux-x64:linux-x64 linux-arm64:linux-arm64 darwin-x64:darwin-x64 darwin-arm64:darwin-arm64; do
            asset="${pair%%:*}"; pkg="${pair##*:}"; ext=""
            case "$asset" in win-*) ext=".exe" ;; esac
            dir="packages/axiom-hook-$pkg"
            test -f "$dir/package.json" || { echo "::error::missing $dir/package.json"; exit 1; }
            test -f "$src/axiom-hook-$asset$ext" || { echo "::error::missing binary axiom-hook-$asset$ext"; exit 1; }
            mkdir -p "$dir/bin"
            cp "$src/axiom-hook-$asset$ext" "$dir/bin/axiom-hook$ext"
            chmod 0755 "$dir/bin/axiom-hook$ext"
            npm_v=$(node -p "require('./$dir/package.json').version")
            mcp_v=$(node -p "require('./packages/mcp/package.json').version")
            [ "$npm_v" = "$mcp_v" ] || { echo "::error::$dir is $npm_v, @codai/axiom-mcp is $mcp_v"; exit 1; }
            (cd "$dir" && npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const f=JSON.parse(s)[0].files.map(x=>x.path);if(!f.some(p=>p.startsWith("bin/axiom-hook"))){console.error("tarball has no bin/axiom-hook: "+f.join(","));process.exit(1)}console.log(f.join(" "))})')
          done
          ls -la packages/axiom-hook-*/bin

      - name: Publish
        run: pnpm exec changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push tags created by changeset
        # `git push --tags` fails the whole run when ANY tag already exists on the remote — and
        # the triggering v<version> tag always does, since it is what started this run. Push only
        # what is new and treat "already exists" rejections as success; any other rejection or a
        # fatal error still fails the step.
        run: |
          set +e
          out=$(git push origin --tags 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          bad=$(printf '%s\n' "$out" | grep -E '^\s*!|^fatal:' | grep -v 'already exists' || true)
          if [ -n "$bad" ]; then echo "::error::tag push failed"; exit 1; fi
          echo "all rejections were 'already exists' - nothing new to push"
        shell: bash

      - name: Verify every tagged package is on the registry
        # npm's CDN needs a moment after publish before the packument lists the new version —
        # 30 s was not enough for the largest tarball (v2.2.1: mcp landed at +45 s, run
        # 35548626466, and the miss skipped every dependent job). v2.5.2 (run 38529340088): all
        # nine packages took 5–7 min to appear. Poll up to ~10 min.
        run: |
          for i in $(seq 1 20); do
            if node scripts/check-release-complete.mjs --strict; then exit 0; fi
            echo "attempt $i: registry not caught up yet; waiting 30 s"; sleep 30
          done
          echo "::error::packages still missing from the registry after 10 minutes"; exit 1

  binaries:
    # D-27: `node --build-sea` embeds the builder's own Node, and SEA blobs carry no version
    # marker, so every target is built natively on its own runner (never cross-injected).
    # Node 26 (LTS from 2026-10-28) is pinned for all five so the binaries share one runtime.
    name: binary ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-2025, target: win-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node 26 (embedded runtime)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Bundle (single inlined CommonJS file)
        run: pnpm --filter @codai/axiom-mcp run build:sea

      - name: Build single executable
        run: node packages/mcp/scripts/build-sea.mjs --out "${{ runner.temp }}/axiom-bin"

      - name: Smoke (compile → check → apply → gate through the binary)
        shell: bash
        run: |
          set -euo pipefail
          bin=$(ls "${{ runner.temp }}"/axiom-bin/axiom-*)
          root="${{ runner.temp }}/smoke-tree"; mkdir -p "$root"
          printf '%s' '{"apiVersion":"axiom.dev/v2","kind":"Plan","name":"sea-smoke","intent":"release smoke","artifacts":[{"path":"src/hello.ts","source":{"type":"inline","content":"export const hi = 1;\n"}}]}' > "$root/plan.json"
          "$bin" compile "$root/plan.json" --root "$root" -o "$root/bundle.json" > "$root/compile.out"
          digest=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).manifestDigest)' "$root/compile.out")
          "$bin" check "$root/bundle.json" --root "$root"
          "$bin" apply "$root/bundle.json" --root "$root" --confirm "$digest" > /dev/null
          test -f "$root/src/hello.ts"
          # Build the hook payload with node so a Windows `D:\a\_temp` cwd is JSON-escaped
          # (a raw backslash made the gate deny with "payload is not JSON", run 35549452689).
          node -e 'process.stdout.write(JSON.stringify({session_id:"s",hook_event_name:"PreToolUse",cwd:process.argv[1],tool_name:"Write",tool_input:{file_path:"src/ok.ts",content:"x"}}))' "$root" | "$bin" gate --stdin
          echo "smoke OK: $("$bin" --version)"

      - name: Build axiom-hook (native gate client, rustup preinstalled on the runner)
        # Built on the same native runner as the SEA binary — no cross linkers, no extra action.
        # Asset name mirrors the SEA scheme: axiom-hook-<os>-<arch>[.exe].
        shell: bash
        working-directory: crates/axiom-hook
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install stable --profile minimal --no-self-update
          cargo +stable build --release --locked
          npm_v=$(node -p 'require("../../packages/mcp/package.json").version')
          hook_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          # S-1322: an error, not a warning — the npm hook packages ship this binary as $npm_v.
          if [ "$npm_v" != "$hook_v" ]; then echo "::error::axiom-hook $hook_v != @codai/axiom-mcp $npm_v (run node scripts/sync-release-versions.mjs)"; exit 1; fi
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          out="${{ runner.temp }}/axiom-bin/axiom-hook-${{ matrix.target }}${ext}"
          cp "target/release/axiom-hook${ext}" "$out"
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --sign - --force "$out"; fi
          "$out" --version
          # Fail-closed smoke: no daemon state, no CLI → deny document, exit 0 (cline format).
          home="${{ runner.temp }}/hook-home"; mkdir -p "$home"
          deny=$(printf '{}' | HOME="$home" USERPROFILE="$home" AXIOM_HOOK_FALLBACK="$home/none" "$out" gate --stdin --format cline 2>/dev/null)
          echo "$deny"
          case "$deny" in *'"cancel":true'*) ;; *) echo "::error::axiom-hook fail-closed smoke failed"; exit 1;; esac
          ls -la "${{ runner.temp }}/axiom-bin"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiom-${{ matrix.target }}
          # Matches axiom-<target>[.exe] AND axiom-hook-<target>[.exe].
          path: ${{ runner.temp }}/axiom-bin/axiom-*
          if-no-files-found: error

      - name: Legal notices (AXIOM LICENSE + bundled deps + embedded Node.js runtime)
        # The SEA binaries inline every runtime dependency of @codai/axiom-mcp and embed Node
        # itself, so their notices ship next to them. Node is pinned to 26 on every runner; the
        # LICENSE is taken from the exact runtime that was embedded here.
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          legal="${{ runner.temp }}/axiom-legal"; mkdir -p "$legal"
          cp LICENSE "$legal/LICENSE"
          node scripts/gen-third-party-notices.mjs --package packages/mcp --out "$legal/THIRD_PARTY_NOTICES.md"
          node_license="$(dirname "$(which node)")/../LICENSE"
          test -f "$node_license" || curl -fsSL "https://raw.githubusercontent.com/nodejs/node/$(node -v)/LICENSE" -o "$node_license"
          { echo "Node.js $(node -v) — runtime embedded in the axiom-<target> executables"; echo; cat "$node_license"; } > "$legal/LICENSE-node.txt"
          ls -la "$legal"

      - name: Upload legal notices
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiom-legal
          path: ${{ runner.temp }}/axiom-legal/*
          if-no-files-found: error

  release-assets:
    name: SHA256SUMS + provenance → GitHub release
    # Covers the ten binaries (axiom + axiom-hook × 5 targets) AND the .vsix (same checksum
    # file, same Sigstore attestation).
    needs: [publish, binaries, vscode-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # gh release create/upload/edit
      id-token: write # Sigstore signing
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download every binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: axiom-*
          path: bin
          merge-multiple: true

      - name: CycloneDX SBOM of @codai/axiom-mcp (S-1322)
        # cyclonedx-npm reads an npm-shaped node_modules, so the just-published tarball (publish
        # polled the registry until it was live) is installed into a scratch npm project —
        # exactly what a consumer resolves, runtime deps only — and described from there.
        # Version pinned; bump deliberately.
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          sb="$RUNNER_TEMP/sbom"; mkdir -p "$sb"; cd "$sb"
          npm init -y >/dev/null
          npm install "@codai/axiom-mcp@$v" --omit dev --no-audit --no-fund --ignore-scripts
          npx -y @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file "$GITHUB_WORKSPACE/bin/axiom-mcp-$v.cdx.json"
          node -e 'const j=require(process.argv[1]);if(j.bomFormat!=="CycloneDX"||!(j.components||[]).length){console.error("empty SBOM");process.exit(1)}console.log(j.specVersion, j.components.length+" components")' "$GITHUB_WORKSPACE/bin/axiom-mcp-$v.cdx.json"

      - name: Checksums
        run: |
          set -euo pipefail
          cd bin
          chmod +x axiom-linux-* axiom-darwin-* axiom-hook-linux-* axiom-hook-darwin-*
          ls -la
          # Every target ships axiom-<target>[.exe] AND axiom-hook-<target>[.exe].
          for a in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win-x64.exe; do
            for p in axiom axiom-hook; do
              test -f "$p-$a" || { echo "::error::missing release asset $p-$a"; exit 1; }
            done
          done
          for f in LICENSE THIRD_PARTY_NOTICES.md LICENSE-node.txt; do
            test -f "$f" || { echo "::error::missing release asset $f"; exit 1; }
          done
          # axiom-* also matches axiom-mcp-<v>.cdx.json (SBOM) and axiom-axm-<v>.vsix.
          sha256sum axiom-* LICENSE THIRD_PARTY_NOTICES.md LICENSE-node.txt | tee SHA256SUMS
          grep -q '\.cdx\.json$' SHA256SUMS || { echo "::error::SBOM missing from SHA256SUMS"; exit 1; }

      - name: Sigstore build provenance (binaries + .vsix + checksums)
        # `gh attestation verify bin/axiom-linux-x64 --owner dragoscv` proves this workflow, at
        # this commit, produced the exact bytes — same guarantee npm provenance gives the packages.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: bin/*

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Created as a DRAFT (here or by vscode-extension, whichever runs first): a published
          # release without SHA256SUMS would be what install.sh/install.ps1 resolve as latest.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes --draft --verify-tag
          gh release upload "$tag" bin/* --repo "$GITHUB_REPOSITORY" --clobber
          # Undraft + mark latest only once SHA256SUMS is really on the release (this also
          # repairs a draft left behind by a cancelled earlier run).
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS \
            || { echo "::error::SHA256SUMS is not attached; leaving the release as a draft"; exit 1; }
          latest=true
          # Never mark an older line latest (e.g. a 2.7.x patch released after 3.0.0).
          git_tags=$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -n "$git_tags" ] && [ "$(printf '%s\n%s\n' "$git_tags" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then latest=false; fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft --jq '.isDraft, .assets[].name'

  mcp-registry:
    # D-29: list io.github.dragoscv/axiom on registry.modelcontextprotocol.io. The registry
    # fetches the npm packument and requires `mcpName` === server.json name and that the exact
    # version already exists on npm, so this runs after `publish` and retries while the CDN
    # catches up. Auth is GitHub OIDC (grants the io.github.<owner>/* namespace).
    name: MCP Registry publish
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher v1.8.1 (sha256-pinned)
        env:
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tgz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tgz" | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher
          rm mcp-publisher.tgz
          ./mcp-publisher --version || true

      - name: server.json version = released version
        run: |
          set -euo pipefail
          v=$(node -p 'require("./packages/mcp/package.json").version')
          node -e '
            const fs = require("fs"); const p = "packages/mcp/server.json";
            const s = JSON.parse(fs.readFileSync(p, "utf8")); const v = process.argv[1];
            s.version = v; for (const pkg of s.packages) pkg.version = v;
            fs.writeFileSync(p, JSON.stringify(s, null, 2) + "\n");
          ' "$v"
          cat packages/mcp/server.json

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish (retry while npm propagates)
        working-directory: packages/mcp
        run: |
          set -euo pipefail
          v=$(node -p 'require("./package.json").version')
          # Idempotent like `changeset publish`: the registry rejects a duplicate version with
          # 400 "cannot publish duplicate version" (a re-run of the same tag, run 35549765572).
          # Saved to a file, then parsed: piping curl into an interpreter reads as download-then-run
          # to OpenSSF Scorecard (Pinned-Dependencies), even though this is only JSON.
          curl -fsSL -o have.json "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.dragoscv%2Faxiom/versions/${v}" 2>/dev/null || echo '{}' > have.json
          have=$(node -e 'try{const j=JSON.parse(require("fs").readFileSync("have.json","utf8"));console.log((j.server??j).version??"")}catch{console.log("")}')
          rm -f have.json
          if [ "$have" = "$v" ]; then echo "io.github.dragoscv/axiom@$v is already on the registry - nothing to publish"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            if ../../mcp-publisher publish 2>&1 | tee publish.log; then exit 0; fi
            if grep -q 'duplicate version' publish.log; then echo "already published (raced a parallel run)"; exit 0; fi
            echo "attempt $i failed; waiting 30 s for the npm packument"; sleep 30
          done
          echo "::error::mcp-publisher publish failed after 6 attempts"; exit 1

      - name: Verify listing
        run: |
          set -euo pipefail
          v=$(node -p 'require("./packages/mcp/package.json").version')
          # The registry answers an occasional 5xx right after a publish (3.0.0: one HTTP 500 on a
          # listing that was already live) - retry like the publish step instead of failing.
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.dragoscv%2Faxiom/versions/latest" -o registry.json \
              && node -e 'const r = JSON.parse(require("fs").readFileSync("registry.json","utf8")); const got = r.server?.version ?? r.version; if (got !== process.argv[1]) { console.error(`registry has ${got}, expected ${process.argv[1]}`); process.exit(1); }' "$v"; then
              cat registry.json; exit 0
            fi
            echo "listing check $i failed; retrying in 20 s"; sleep 20
          done
          echo "::error::registry listing for $v not confirmed after 6 attempts"; exit 1

  action-tag:
    # D-31 / S-1322: consumers pin `uses: dragoscv/axiom/action@v<major>`. Move that floating
    # tag to this release only when it is the HIGHEST v<major>.x.y tag — a late 3.0.2 hotfix
    # tagged after 3.1.0 must not drag `v3` backwards. Each major has its own tag, so a 3.x
    # release never touches `v2` (and a 2.7.x patch still moves `v2`). A plain tag, no Release
    # attached, so immutable releases can be enabled later without locking it.
    name: move floating action tag
    needs: [publish, release-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # force-push the v<major> tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Move v<major> → ${{ github.ref_name }} (forward only)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected tag $tag"; exit 1 ;;
          esac
          case "$tag" in *-*) echo "::notice::prerelease $tag - floating tag not moved"; exit 0 ;; esac
          major="${tag%%.*}"   # v3
          git fetch --tags --force origin
          highest=$(git tag -l "${major}.*" --sort=-v:refname | grep -E "^${major}\.[0-9]+\.[0-9]+$" | head -n 1)
          if [ "$highest" != "$tag" ]; then
            echo "::notice::$tag is not the highest ${major}.x tag ($highest) - ${major} stays where it is"
            git ls-remote --tags origin "$major"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" -m "dragoscv/axiom/action $major → $tag" "${GITHUB_SHA}"
          git push origin "refs/tags/$major" --force
          git ls-remote --tags origin "$major"

  homebrew-tap:
    # S-602: `brew install dragoscv/tap/axiom` installs the SEA binaries of this release. The
    # formula is rendered from the release's own SHA256SUMS (the attested checksums), so it can
    # only run after release-assets. Auth = HOMEBREW_TAP_DEPLOY_KEY, the private half of a
    # write deploy key on dragoscv/homebrew-tap (scoped to that one repo, no user PAT); without
    # it the job emits a notice.
    name: Homebrew tap formula
    needs: release-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # gh release download; the tap push uses its own deploy key
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Checkout
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render + push Formula/axiom.rb
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key"; chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:dragoscv/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          node scripts/render-homebrew-formula.mjs "$v" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/tap/Formula/axiom.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/axiom.rb
          if git diff --cached --quiet; then echo "formula already at $v"; exit 0; fi
          git commit -m "feat: axiom $v"
          git push origin HEAD
          rm -f "$key"
          grep -m1 -E '^\s*url ' Formula/axiom.rb

      - name: Homebrew tap skipped
        if: env.HOMEBREW_TAP_DEPLOY_KEY == ''
        run: |
          echo "::notice title=S-602::HOMEBREW_TAP_DEPLOY_KEY is not set - dragoscv/homebrew-tap not updated. Add a write deploy key to dragoscv/homebrew-tap and store its private key as repo secret HOMEBREW_TAP_DEPLOY_KEY."

  vscode-extension:
    # S-412: the .vsix is always built and attached to the GitHub release, then published to the
    # VS Code Marketplace as `dragoscv.axiom-axm` — the same publisher and the same credential as
    # `dragoscv.codai-vscode`: Entra managed identity `codai-marketplace-publisher` via GitHub OIDC
    # (environment `marketplace-publish`, federated credential `gh-axiom-marketplace-publish`,
    # `vsce --azure-credential`). No PAT is stored; `VSCE_PAT` is only an optional fallback
    # (global Azure DevOps PATs retire 2026-12-01).
    name: vscode-axm → .vsix + Marketplace (managed identity)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: marketplace-publish
    permissions:
      contents: write # gh release create/upload
      id-token: write # Azure OIDC → managed identity → Marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace libs (axm-lsp is bundled into the extension)
        run: pnpm build

      - name: Package .vsix
        run: pnpm --filter axiom-axm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiom-axm-vsix
          path: .copilot-tmp/axiom-axm-*.vsix
          if-no-files-found: error
          # upload-artifact ≥ 4.4 skips dot-directories unless told otherwise; the package script
          # writes into the gitignored `.copilot-tmp/` on purpose (never into the tree).
          include-hidden-files: true

      - name: Attach .vsix to the GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes --draft --verify-tag
          gh release upload "$tag" .copilot-tmp/axiom-axm-*.vsix --repo "$GITHUB_REPOSITORY" --clobber

      - name: Azure login (OIDC, managed identity)
        id: azlogin
        if: startsWith(github.ref, 'refs/tags/v') && vars.AZURE_CLIENT_ID != ''
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to the VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AZ_OK: ${{ steps.azlogin.outcome == 'success' }}
          PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set +e
          vsix=$(ls .copilot-tmp/axiom-axm-*.vsix)
          publish() { pnpm --filter axiom-axm exec vsce publish --packagePath "$GITHUB_WORKSPACE/$vsix" "$@" 2>&1; }
          code=1
          if [ "$AZ_OK" = "true" ]; then
            out=$(publish --azure-credential); code=$?
            printf '%s\n' "$out"
            if [ $code -eq 0 ] || printf '%s' "$out" | grep -qi 'already exists'; then echo "::notice::published dragoscv.axiom-axm with managed identity"; exit 0; fi
            echo "::warning::managed-identity publish failed - trying VSCE_PAT"
          fi
          if [ -z "$PAT" ]; then echo "::error::no Marketplace credential (Azure login failed, VSCE_PAT unset)"; exit 1; fi
          out=$(VSCE_PAT="$PAT" publish); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ] && ! printf '%s' "$out" | grep -qi 'already exists'; then exit $code; fi

      - name: Publish to Open VSX
        # S-601: the same .vsix for Cursor, VSCodium, Windsurf and Gitpod, under the existing
        # open-vsx.org namespace `dragoscv` (tasks2, vsrchat live there); its access token is the
        # repo secret OVSX_PAT. Open VSX rejects an existing version, so a re-run is tolerated.
        if: startsWith(github.ref, 'refs/tags/v') && env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          vsix=$(ls .copilot-tmp/axiom-axm-*.vsix)
          set +e
          out=$(npx -y ovsx@1.2.0 publish "$vsix" -p "$OVSX_PAT" 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if printf '%s' "$out" | grep -qi 'already published'; then echo "already on Open VSX"; exit 0; fi
          exit "$rc"

      - name: Open VSX publish skipped
        if: startsWith(github.ref, 'refs/tags/v') && env.OVSX_PAT == ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "::notice title=S-601::OVSX_PAT is not set - Open VSX not published. Owner: open-vsx.org (namespace dragoscv) → Settings → Access Tokens, add the token as repo secret OVSX_PAT."
