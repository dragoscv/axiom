name: Release

# Publishes every @codai/axiom-* package via Changesets with npm trusted
# publishing (OIDC). No NPM_TOKEN secret: npm ≥ 11.5.1 exchanges the GitHub
# id-token for a short-lived credential and attaches provenance automatically.
# Prerequisite (one-time, per package on npmjs.com): Settings → Trusted
# publishing → GitHub Actions → repo dragoscv/axiom, workflow release.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # changeset publish creates git tags
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "0"

jobs:
  publish:
    name: build → guards → changeset publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: npm ≥ 11.5 (trusted publishing)
        run: |
          npm i -g npm@latest
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm exec vitest run

      - name: Guards (strict — dist must exist)
        # `release-complete` asserts every tagged version is already ON the registry; running it
        # here would fail by construction on the very tag we are about to publish. It runs after
        # Publish instead, as the live verification that all 9 packages actually landed.
        run: node scripts/run-guards.mjs --strict --skip=release-complete

      - name: Publish
        run: pnpm exec changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push tags created by changeset
        # `git push --tags` fails the whole run when ANY tag already exists on the remote — and
        # the triggering v<version> tag always does, since it is what started this run. Push only
        # the tags the remote is actually missing; a genuine push failure still fails the step.
        run: |
          git fetch --tags --quiet origin
          remote=$(git ls-remote --tags origin | sed 's#.*refs/tags/##' | grep -v '\^{}' | sort -u)
          missing=$(comm -23 <(git tag -l | sort -u) <(echo "$remote"))
          if [ -z "$missing" ]; then echo "no new tags to push"; exit 0; fi
          echo "pushing: $missing"
          git push origin $missing
        shell: bash

      - name: Verify every tagged package is on the registry
        # npm's CDN needs a moment after publish before the packument lists the new version.
        run: |
          sleep 30
          node scripts/check-release-complete.mjs --strict

  vscode-extension:
    # S-412: the .vsix is always built and attached to the GitHub release; Marketplace publish
    # runs only when the owner has created publisher `codai` and stored its PAT as `VSCE_PAT`
    # (Azure DevOps PAT, scope Marketplace → Manage). Without the secret the job still proves the
    # artifact packages and leaves it downloadable from the release page.
    name: vscode-axm → .vsix (+ Marketplace when VSCE_PAT is set)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace libs (axm-lsp is bundled into the extension)
        run: pnpm build

      - name: Package .vsix
        run: pnpm --filter axiom-axm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axiom-axm-vsix
          path: .copilot-tmp/axiom-axm-*.vsix
          if-no-files-found: error

      - name: Attach .vsix to the GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          gh release upload "$tag" .copilot-tmp/axiom-axm-*.vsix --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to the VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          pnpm --filter axiom-axm exec vsce publish --packagePath .copilot-tmp/axiom-axm-*.vsix

      - name: Marketplace publish skipped
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          echo "::notice title=S-412::VSCE_PAT is not set - .vsix attached to the release only. Owner: create Marketplace publisher codai and add the PAT as repo secret VSCE_PAT."
