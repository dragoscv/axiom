name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # pnpm is resolved from the root package.json "packageManager" field.
  COREPACK_ENABLE_STRICT: "0"

jobs:
  quality:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-changeset-present diffs against origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        # version comes from package.json#packageManager

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome check .

      # Build first: package exports point at dist/, so cross-package types
      # (@codai/axiom-schema → plan/checks/apply) only resolve after tsdown ran.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (coverage)
        run: pnpm exec vitest run --coverage

      - name: Guards
        # release-complete is judged by release.yml after publish: on a `v*` push the tag
        # exists before the packages do, so CI on that commit reported all 9 as "absent
        # from the registry" (runs 35506503730, 35507489074) while the release was in flight.
        run: node scripts/run-guards.mjs --strict --skip=release-complete

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  rust:
    # crates/axiom-hook — the native gate client (std only, no crates). rustup is preinstalled
    # on GitHub runners, so no toolchain action (and no new pin) is needed.
    name: rust / axiom-hook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/axiom-hook
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  golden-cross-os:
    name: golden digests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build schema, canon, plan
        run: pnpm --filter @codai/axiom-schema --filter @codai/axiom-canon --filter @codai/axiom-plan build

      # update-golden.ts has no --check flag: it rewrites the expected files.
      # Run it, then `git diff --exit-code` proves this OS computed identical digests.
      - name: Recompute golden digests on this OS
        run: node --import tsx/esm packages/testkit/scripts/update-golden.ts

      - name: Digests must match the committed fixtures
        run: git diff --exit-code -- packages/testkit/golden

      - name: Golden test suite
        run: pnpm --filter @codai/axiom-testkit test

      - name: Upload digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-digests-${{ matrix.os }}
          path: packages/testkit/golden/*.expected.json
          retention-days: 7

  conformance:
    # MCP conformance over Streamable HTTP (PLAN.md S-206). Ubuntu only: the suite is
    # transport-level and OS-independent; the quality matrix already covers the OS axis.
    # `continue-on-error: false` — the local run is fully green (0 unexpected, 0 stale).
    name: mcp conformance / ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (the harness spawns packages/mcp/dist/cli.js)
        run: pnpm build

      - name: Conformance (expected-failures baseline)
        run: pnpm --filter @codai/axiom-conformance conformance --out packages/conformance/results

      - name: Package the .vsix (catches engines.vscode vs @types/vscode drift before a tag)
        # release run 38486626658 failed only here: Dependabot bumped @types/vscode past engines.vscode.
        run: pnpm --filter axiom-axm run package

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: packages/conformance/results/
          if-no-files-found: ignore
          retention-days: 14

  verify-action:
    # S-403: dogfood the composite action (action/action.yml). Compile a plan against a
    # scratch tree, apply it, then run the action — it must pass on the applied tree, fail
    # after a hand edit, and (on push to main) upload an in-toto attestation.
    name: verify-tree action / ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Compile + apply a plan into a scratch tree
        id: scratch
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/tree"
          mkdir -p "$tree"
          cat > "$RUNNER_TEMP/plan.json" <<'JSON'
          {"apiVersion":"axiom.dev/v2","kind":"Plan","name":"ci-verify","intent":"S-403 action dogfood",
           "artifacts":[{"path":"src/hello.ts","source":{"type":"inline","content":"export const hi = 1;\n"}},
                        {"path":"README.md","source":{"type":"inline","content":"# hi\n"}}]}
          JSON
          node packages/mcp/dist/cli.js compile "$RUNNER_TEMP/plan.json" --root "$tree" -o "$RUNNER_TEMP/bundle.json" > "$RUNNER_TEMP/compile.out"
          digest=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).manifestDigest)' "$RUNNER_TEMP/compile.out")
          node packages/mcp/dist/cli.js apply "$RUNNER_TEMP/bundle.json" --root "$tree" --confirm "$digest" > /dev/null
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "bundle=$RUNNER_TEMP/bundle.json" >> "$GITHUB_OUTPUT"

      - name: Action passes on the applied tree (with attestation on main)
        id: pass
        uses: ./action
        with:
          bundle: ${{ steps.scratch.outputs.bundle }}
          root: ${{ steps.scratch.outputs.tree }}
          local-cli: ${{ github.workspace }}/packages/mcp/dist/cli.js
          attest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          attestation-path: ${{ runner.temp }}/axiom-attestation.intoto.json

      - name: Outputs are set
        run: |
          test "${{ steps.pass.outputs.ok }}" = "true"
          test "${{ steps.pass.outputs.mismatches }}" = "0"
          case "${{ steps.pass.outputs.manifest-digest }}" in sha256:*) ;; *) echo "bad digest"; exit 1;; esac

      - name: Hand-edit the tree
        run: echo "tampered" >> "${{ steps.scratch.outputs.tree }}/src/hello.ts"

      - name: Action fails on the drifted tree
        id: fail
        continue-on-error: true
        uses: ./action
        with:
          bundle: ${{ steps.scratch.outputs.bundle }}
          root: ${{ steps.scratch.outputs.tree }}
          local-cli: ${{ github.workspace }}/packages/mcp/dist/cli.js

      - name: The drifted run must have failed with one mismatch
        run: |
          test "${{ steps.fail.outcome }}" = "failure"
          test "${{ steps.fail.outputs.ok }}" = "false"
          test "${{ steps.fail.outputs.mismatches }}" = "1"
