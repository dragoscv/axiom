name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # pnpm is resolved from the root package.json "packageManager" field.
  COREPACK_ENABLE_STRICT: "0"

jobs:
  quality:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # check-changeset-present diffs against origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # version comes from package.json#packageManager

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome check .

      # Build first: package exports point at dist/, so cross-package types
      # (@codai/axiom-schema → plan/checks/apply) only resolve after tsdown ran.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (coverage)
        run: pnpm exec vitest run --coverage

      - name: Guards
        run: node scripts/run-guards.mjs --strict

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  golden-cross-os:
    name: golden digests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build schema, canon, plan
        run: pnpm --filter @codai/axiom-schema --filter @codai/axiom-canon --filter @codai/axiom-plan build

      # update-golden.ts has no --check flag: it rewrites the expected files.
      # Run it, then `git diff --exit-code` proves this OS computed identical digests.
      - name: Recompute golden digests on this OS
        run: node --import tsx/esm packages/testkit/scripts/update-golden.ts

      - name: Digests must match the committed fixtures
        run: git diff --exit-code -- packages/testkit/golden

      - name: Golden test suite
        run: pnpm --filter @codai/axiom-testkit test

      - name: Upload digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-digests-${{ matrix.os }}
          path: packages/testkit/golden/*.expected.json
          retention-days: 7

  conformance:
    # MCP conformance over Streamable HTTP (PLAN.md S-206). Ubuntu only: the suite is
    # transport-level and OS-independent; the quality matrix already covers the OS axis.
    # `continue-on-error: false` — the local run is fully green (0 unexpected, 0 stale).
    name: mcp conformance / ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (the harness spawns packages/mcp/dist/cli.js)
        run: pnpm build

      - name: Conformance (expected-failures baseline)
        run: pnpm --filter @codai/axiom-conformance conformance --out packages/conformance/results

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-report
          path: packages/conformance/results/
          if-no-files-found: ignore
          retention-days: 14
