# Dependabot — weekly, grouped, Conventional Commit prefixes.
# External versions live only in pnpm-workspace.yaml catalogs (`catalog:` in every
# package.json); Dependabot has supported pnpm catalogs since 2025, so the npm
# ecosystem at "/" covers the whole workspace.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling:
        patterns:
          - tsdown
          - vitest
          - "@vitest/*"
          - "@biomejs/*"
          - typescript
          - "@types/*"
          - fast-check
          - "@stryker-mutator/*"
          - tsx
          - "@changesets/*"
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      production:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bucharest
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # v6 self-updates pnpm to the `packageManager` version but on windows-2025 the resulting
      # `pnpm install`/`pnpm build` produce no output and no dist (PR #7, run 35556883562):
      # bundle-size then fails with "packages/mcp/dist/cli.js missing". Stay on v4 until the
      # Windows path is fixed upstream; re-test by removing this block.
      - dependency-name: pnpm/action-setup
        versions: [">=5"]
    groups:
      actions:
        patterns:
          - "*"
