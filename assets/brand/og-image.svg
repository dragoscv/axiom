<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AXIOM — the transactional write gate for coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1e"/>
      <stop offset="1" stop-color="#050410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d4de6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- mark -->
  <g transform="translate(96 160) scale(2.5)">
    <rect width="128" height="128" rx="28" fill="#0f0d22"/>
    <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#7c5cff" stroke-opacity=".4" stroke-width="2"/>
    <path d="M30 104 L54 26 h8 L38 104 Z" fill="url(#bar)"/>
    <path d="M98 104 L74 26 h-8 L90 104 Z" fill="url(#bar)"/>
    <rect x="38" y="72" width="52" height="12" rx="6" fill="url(#beam)"/>
    <circle cx="64" cy="78" r="4" fill="#090814"/>
    <circle cx="64" cy="78" r="2" fill="#67e8f9"/>
  </g>

  <!-- copy -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#f5f3ff">
    <text x="480" y="252" font-size="112" font-weight="800" letter-spacing="8">AXIOM</text>
    <text x="484" y="318" font-size="40" font-weight="500" fill="#c4b5fd">The transactional write gate for coding agents.</text>
    <g font-size="26" font-weight="500" fill="#a5b4fc">
      <text x="484" y="392">Plan → canonical Manifest → set-level checks → two-phase apply</text>
    </g>
    <g font-size="22" fill="#94a3b8">
      <text x="484" y="452">MCP server · CLI · PreToolUse hook · GitHub Action · VS Code</text>
      <text x="484" y="490" fill="#67e8f9" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">npx -y @codai/axiom-mcp mcp --root /path/to/repo</text>
    </g>
  </g>
  <text x="1184" y="600" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="20" fill="#64748b">dragoscv.github.io/axiom</text>
</svg>
