<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AXIOM — the transactional write gate for coding agents">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c1917" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf7ef" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbf7ef" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- paper -->
  <rect width="1280" height="640" fill="#fbf7ef"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="640" width="640" height="640" fill="url(#fade)"/>
  <!-- hairlines -->
  <line x1="80" y1="88" x2="1200" y2="88" stroke="#1c1917" stroke-opacity=".25"/>
  <line x1="80" y1="552" x2="1200" y2="552" stroke="#1c1917" stroke-opacity=".25"/>

  <!-- seal, top-left third -->
