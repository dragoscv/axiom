  <!-- copy -->
  <g fill="#1c1917">
    <text x="452" y="262" font-family="'Instrument Serif', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="128" letter-spacing="6">AXIOM</text>
